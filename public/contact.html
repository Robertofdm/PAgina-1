    <h1>Contacto</h1>

<section>
  <h2>Formulario de contacto</h2>
  <p>
    Si deseas ponerte en contacto conmigo, puedes completar el siguiente formulario.
  </p>

  <form>
    <div>
      <label for="name">Nombre:</label><br>
      <input type="text" id="name" name="name" placeholder="Tu nombre">
    </div>

    <br>

    <div>
      <label for="email">Correo electrónico:</label><br>
      <input type="email" id="email" name="email" placeholder="tucorreo@gmail.com">
    </div>

    <br>

    <div>
      <label for="message">Mensaje:</label><br>
      <textarea id="message" name="message" rows="5" placeholder="Escribe tu mensaje aquí"></textarea>
    </div>

    <br>

    <button type="submit">Enviar</button>
  </form>
</section>
  </div>
